<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>BA Advisory Desk Checkout Complete</title>
    <script>
      const params = new URLSearchParams(window.location.search);
      const next = new URL("./index.html", window.location.href);
      if (params.get("session_id")) next.searchParams.set("session_id", params.get("session_id"));
      if (params.get("product")) next.searchParams.set("product", params.get("product"));
      next.hash = "dashboard";
      window.location.replace(next.toString());
    </script>
  </head>
  <body>
    <p>Opening BA Advisory Desk.</p>
    <p><a href="./index.html#dashboard">Continue to client workspace</a></p>
  </body>
</html>
